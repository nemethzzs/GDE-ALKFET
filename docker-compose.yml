services:

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: ghcr.io/nemethzzs/gde-alkfet-backend:latest
    container_name: backend
    ports:
      - "5000:8080"
    depends_on:
      - mongo

  frontend:
    image: ghcr.io/nemethzzs/gde-alkfet-frontend:latest
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo_data: